<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-login">
      <form id="FormLogin">

          <h1>Login</h1>

        <div class="input-box">
          <label for="email">E-mail:</label>
            <input
              type="email"
              id="email"
              placeholder="Informe seu e-mail">
        </div>
          
        <div class="input-box">
          <label for="password">Senha:</label>
            <input
              type="password"
              id="password"
              placeholder="Informe sua senha">
        </div>
        <br>
        <input type="submit" value="Entrar" class="btn" id="Cadastrar"/>
      
      </form>
    </div>
    
</body>
<script>
  const emailCerto = "admin@admin123";
  const senhaCerto= "123456";

  document.getElementById("Cadastrar").addEventListener("click", (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("password").value.trim();

    const emailCerto = "admin@admin123";
    const senhaCerto = "123456";

    if (email === emailCerto && senha === senhaCerto) {
        alert("Login realizado com sucesso!");
        window.location.href="crud.html";
    } else {
        alert("Email ou senha inválidos!");
    }
  });
</script>
</html>
