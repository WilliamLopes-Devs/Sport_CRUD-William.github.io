<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  
  <div class="container">

    <a href="#" id="voltar" onclick="window.location.href='index.html'">↩ Voltar</a>

    <form class="card" id="formCadastro">
      
      <h1>Cadastro</h1>
      
      <div class="input-box">
        <label>Nome:</label>
          <input 
            type="text" 
            id="nome" 
          placeholder="Digite seu nome">
      </div>

      <div class="input-box">
        <label>Modalidade:</label>
        <select id="modalidade">
          <option value="">Selecione uma modalidade</option>
          <option value="1">Futebol</option>
          <option value="2">Basquete</option>
          <option value="3">Vôlei</option>
          <option value="4">Natação</option>
        </select>
      </div> 
  
      <div class="input-box">
        <label>Data de Nascimento:</label>
          <input 
            id="datanascimento" 
            type="date">
      </div>

      <div class="buttons">
        <button 
          type="submit">Cadastrar</button>
        <button 
          type="button" 
          id="listar" 
          onclick="window.location.href='index3.html'">Listar Todos</button>
      </div>
      
    </form>
  </div>

</body>

<script src="script.js"></script>
 
</html>
